name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: npm install

      - name: 5. Preparar estructura web
        run: |
          mkdir -p www
          # Si index.html está en la raíz, asegúrate de moverlo a www si es necesario:
          if [ -f index.html ]; then cp index.html www/; fi

      - name: 6. Inicializar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 7. Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 8. Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 9. Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
